name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linter
        run: pip install ruff

      - name: Run linter
        run: cd backend && ruff check .

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tru8_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tru8_test
      REDIS_URL: redis://localhost:6379
      TESTING: "true"
      DEBUG: "false"
      SECRET_KEY: "test-secret-key-for-ci-only"
      CLERK_SECRET_KEY: "sk_test_placeholder_for_ci"
      CLERK_PUBLISHABLE_KEY: "pk_test_placeholder_for_ci"
      CLERK_JWT_ISSUER: "https://test.clerk.accounts.dev"
      OPENAI_API_KEY: "sk-test-placeholder"
      ENVIRONMENT: "testing"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run unit tests
        run: cd backend && pytest tests/unit/ -v --tb=short

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Security scan
        run: |
          cd backend
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2024-48 || echo "::warning::Some vulnerabilities found - review required"

  web-checks:
    name: Web Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Lint
        run: cd web && npm run lint

      - name: TypeCheck
        run: cd web && npm run typecheck

      - name: Build
        run: cd web && npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder

  # Migration check - ensures no pending migrations
  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tru8_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Required for config.py to load when importing models
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tru8_test
      SECRET_KEY: "test-secret-key-for-ci-only"
      CLERK_SECRET_KEY: "sk_test_placeholder_for_ci"
      CLERK_PUBLISHABLE_KEY: "pk_test_placeholder_for_ci"
      CLERK_JWT_ISSUER: "https://test.clerk.accounts.dev"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          pip install alembic asyncpg sqlmodel psycopg2-binary

      - name: Run migrations
        run: |
          cd backend
          alembic upgrade head

      - name: Check for pending migrations
        run: |
          cd backend
          alembic check || echo "::warning::Pending migrations detected"
