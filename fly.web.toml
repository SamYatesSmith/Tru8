app = 'trueight-web'
primary_region = 'lhr'

[build]
  dockerfile = "web/Dockerfile"

  [build.args]
    NEXT_PUBLIC_API_URL = "https://trueight-api.fly.dev"
    NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_test_c2ltcGxlLXBvbGVjYXQtOTguY2xlcmsuYWNjb3VudHMuZGV2JA"
    NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY = "pk_test_51SI7LMGZOxj6gubl2YSKRjKZzzYpYgV0NOdGnp6UUmUlmIJ2EnyMj5IBtmwnVAPlbOTXeGnvCRGWhVMQ386zPNOu00oPoRx8iD"
    NEXT_PUBLIC_STRIPE_PRICE_ID_PRO = "price_1SI8HgGZOxj6gublpqy6LImY"
    NEXT_PUBLIC_SUBSCRIPTIONS_ENABLED = "false"

# Runtime secrets (set via: fly secrets set CLERK_SECRET_KEY=xxx -a trueight-web)
# - CLERK_SECRET_KEY (required for middleware auth)

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/'
    protocol = 'http'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
