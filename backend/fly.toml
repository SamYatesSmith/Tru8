# fly.toml app configuration file generated for trueight-api on 2026-01-08T13:28:36Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'trueight-api'
primary_region = 'lhr'

[build]

[mounts]
  source = "models_cache"
  destination = "/models"
  processes = ["web", "worker"]

[env]
  # ML Model cache directories (persistent volume)
  HF_HOME = '/models/huggingface'
  SENTENCE_TRANSFORMERS_HOME = '/models/sentence-transformers'
  TRANSFORMERS_CACHE = '/models/transformers'
  DEBUG = 'false'
  DATABASE_SSL = 'false'  # Fly.io internal network doesn't need SSL
  ENABLE_ABSTENTION_LOGIC = 'true'
  ENABLE_API_RETRIEVAL = 'true'
  ENABLE_ARTICLE_CLASSIFICATION = 'true'
  ENABLE_CLAIM_CLASSIFICATION = 'true'
  ENABLE_CROSS_ENCODER_RERANK = 'true'
  ENABLE_DEBERTA_NLI = 'true'
  ENABLE_DEDUPLICATION = 'true'
  ENABLE_DOMAIN_CAPPING = 'true'
  ENABLE_DOMAIN_CREDIBILITY_FRAMEWORK = 'true'
  ENABLE_EMAIL_NOTIFICATIONS = 'true'
  ENABLE_ENHANCED_EXPLAINABILITY = 'true'
  ENABLE_EVIDENCE_RELEVANCE_FILTER = 'true'
  ENABLE_FACTCHECK_API = 'true'
  ENABLE_GLOBAL_DOMAIN_CAPPING = 'true'
  ENABLE_JUDGE_FEW_SHOT = 'true'
  ENABLE_LEGAL_SEARCH = 'true'
  ENABLE_QUERY_EXPANSION = 'true'
  ENABLE_QUERY_PLANNING = 'true'
  ENABLE_RHETORICAL_CONTEXT = 'true'
  ENABLE_SEMANTIC_RELEVANCE_FILTER = 'true'
  ENABLE_SEMANTIC_SNIPPET_EXTRACTION = 'true'
  ENABLE_SOURCE_DIVERSITY = 'true'
  ENABLE_TEMPORAL_CONTEXT = 'true'
  ENVIRONMENT = 'production'
  PORT = '8000'
  SUBSCRIPTIONS_ENABLED = 'false'

[processes]
  web = 'uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1'
  worker = 'celery -A app.workers worker --loglevel=info --concurrency=2'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['web']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '120s'  # Allow time for model download on first startup
    method = 'GET'
    path = '/'  # Root path always works
    protocol = 'http'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['web']

[[vm]]
  memory = '8gb'
  cpu_kind = 'performance'
  cpus = 2
  processes = ['worker']
