[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tru8-mcp"
version = "1.0.0"
description = "Tru8 Evidence Research MCP server — structured evidence research tools for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "evidence", "fact-check", "ai-agent", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
]

[project.scripts]
tru8-mcp = "tru8_mcp.server:main"
